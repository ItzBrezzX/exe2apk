name: Tauri EXE to APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nama aplikasi (kosong = otomatis dari exe)"
        required: false
        default: ""
      app_id:
        description: "Application ID, mis. com.contoh.app (kosong = otomatis)"
        required: false
        default: ""
      build_type:
        description: "Jenis build"
        type: choice
        options: [release, debug]
        default: release
      abi:
        description: "Arsitektur (aarch64 untuk HP modern)"
        type: choice
        options: [aarch64, armv7, x86_64, i686, all]
        default: aarch64
      web_url:
        description: "Fallback: URL web jika aset frontend gagal diekstrak (opsional)"
        required: false
        default: ""

concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  NDK_VERSION: "27.0.12077973"
  RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@v3

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full icoutils
          sudo apt-get install -y 7zip || true
          pip install brotli pillow
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          npm i -g @tauri-apps/cli@^2
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache untauri
        id: cache-untauri
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/untauri
          key: untauri-0.5.1
      - name: Install untauri
        if: steps.cache-untauri.outputs.cache-hit != 'true'
        run: cargo install untauri --version 0.5.1 --locked

      - name: Extract installer and find Tauri app
        run: |
          ls -la input
          S7=7z; command -v 7zz >/dev/null && S7=7zz
          mkdir -p work/installer
          for f in input/*; do
            case "$f" in
              *.exe|*.msi|*.zip|*.7z) $S7 x -y -o"work/installer/$(basename "$f")" "$f" >/dev/null || true ;;
            esac
          done
          APP_EXE=$(python tools/find_app_exe.py work/installer input/)
          echo "APP_EXE=$APP_EXE" >> "$GITHUB_ENV"
          echo "App exe: $APP_EXE"

      - name: Extract frontend
        run: tools/extract_frontend.sh "$APP_EXE" www || echo "EXTRACT_FAILED=1" >> "$GITHUB_ENV"

      - name: Add inspect report to summary
        if: always()
        run: |
          if [ -f work/inspect.txt ]; then
            { echo '### untauri inspect'; echo '```'; cat work/inspect.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate Tauri project
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_ID: ${{ inputs.app_id }}
          WEB_URL: ${{ inputs.web_url }}
        run: |
          python tools/prepare_project.py --www www --exe "$APP_EXE" \
            --name "$APP_NAME" --id "$APP_ID" --web-url "$WEB_URL"
          mkdir -p src-tauri/icons
          python tools/make_icon.py "$APP_EXE" src-tauri/icons/icon.png
          tauri icon src-tauri/icons/icon.png
          tauri android init --ci

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build APK
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          ABI: ${{ inputs.abi }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: tools/build_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          if-no-files-found: error
