name: Blueberry Installer Audit

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: "Installer file inside input/ (ZIP, EXE, or MSI)"
        required: true
        default: "BlueberrySetup.zip"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Audit installer without assuming Tauri
        env:
          INPUT_FILE: ${{ inputs.input_file }}
        run: |
          python3 tools/audit_installer.py \
            --input "input/${INPUT_FILE}" \
            --output "blueberry-inspect"

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blueberry-installer-inspection
          path: blueberry-inspect/
          if-no-files-found: warn
          retention-days: 7
